[project]
name = "criteria-evaluacion"
version = "0.1.0"
description = "API for evaluating repository compliance across eight criteria areas"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.3",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.14.3",
    "fastapi[standard]>=0.128.6",
    "httpx>=0.28.1",
    # "playwright>=1.58.0",
    "python-dateutil>=2.9.0.post0",
    "pydantic-settings>=2.12.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]
